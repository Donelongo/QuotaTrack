# Builds the packaged apps (QuotaTrack.exe and QuotaTrack.app) with PyInstaller.
# Push a tag such as v1.0.0 and they're attached to a GitHub release of that name;
# run it by hand from the Actions tab to just get the files as a download.
name: Build apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: QuotaTrack-Windows.exe
          - os: macos-latest  # Apple silicon
            file: QuotaTrack-macOS.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyinstaller==6.22.3
      - run: pyinstaller --noconfirm packaging/QuotaTrack.spec

      - name: Name the Windows app
        if: runner.os == 'Windows'
        run: Move-Item dist/QuotaTrack.exe ${{ matrix.file }}
      - name: Zip the Mac app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/QuotaTrack.app ${{ matrix.file }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: ${{ matrix.file }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.file }}
